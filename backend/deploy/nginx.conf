# QanoonAI FastAPI backend — Nginx reverse proxy
# Place at: /etc/nginx/sites-available/qanoonai
# Symlink:  ln -s /etc/nginx/sites-available/qanoonai /etc/nginx/sites-enabled/

# Rate limiting zone for auth endpoints (10 req/s per IP)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

# Upstream — gunicorn on localhost
upstream qanoonai_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Let certbot handle ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # ------------------------------------------------------------------
    # SSL — managed by certbot (paths created automatically)
    # Run: sudo certbot --nginx -d api.yourdomain.com
    # ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # Rate-limited auth endpoints
    # ------------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|register|forgot-password) {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass http://qanoonai_backend;
        include /etc/nginx/proxy_params;
    }

    # ------------------------------------------------------------------
    # SSE streaming endpoints — disable buffering so tokens stream
    # immediately to the client instead of being batched by nginx
    # ------------------------------------------------------------------
    location ~ ^/api/v1/(briefs|judgments|research)/.*/(generate|stream) {
        proxy_pass http://qanoonai_backend;
        include /etc/nginx/proxy_params;

        # CRITICAL for SSE: disable all buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Match gunicorn timeout — AI streams can run 30-120+ seconds
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ------------------------------------------------------------------
    # All other API endpoints
    # ------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://qanoonai_backend;
        include /etc/nginx/proxy_params;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Block everything else
    location / {
        return 404;
    }

    # ------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------
    access_log /var/log/nginx/qanoonai_access.log;
    error_log  /var/log/nginx/qanoonai_error.log;
}
